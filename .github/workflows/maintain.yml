name: Maintenance validation

on:
  push:
    branches: [v12-mod-maintain]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CYPRESS_INSTALL_BINARY: '0'
    services:
      postgres:
        image: postgres:18-alpine
        ports: ['54312:5432']
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d test-misskey"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['56312:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global yarn@1.22.19
      - run: node --test scripts/test/normalize-yarn-aliases.test.mjs
      - run: node scripts/normalize-yarn-aliases.mjs --check
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -o pipefail
          if yarn install --frozen-lockfile --non-interactive 2>&1 | tee .maintenance-ci-install.log; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          message = Path('.maintenance-ci-install.log').read_text(errors='replace')[-6000:]
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Frozen dependency installation failed::' + escaped)
          PY
          exit 1
      - run: yarn test:regression:harness
      - name: Verify lockfiles were preserved
        run: git diff --exit-code
      - name: Configure isolated fixture database
        run: |
          cp .github/misskey/test.yml .config/default.yml
          cp .github/misskey/test.yml .config/test.yml
      - name: Check backend source and type contracts
        run: yarn typecheck:backend
      - name: Check all client TypeScript, Vue templates, service worker and generated contracts
        run: yarn typecheck:frontend
      - run: yarn build
      - run: yarn migrate
      - name: Start application and check HTTP behavior
        run: yarn exec start-server-and-test start http://127.0.0.1:61812 'node scripts/maintenance-smoke.mjs'
      - name: Unit tests and source coverage
        run: yarn jest --coverage --coverageReporters=json-summary --coverageReporters=lcov --coverageReporters=text-summary
      - name: Configure regression browser
        timeout-minutes: 10
        shell: bash
        run: |
          for regression_browser in google-chrome chromium chromium-browser; do
            if command -v "$regression_browser" >/dev/null; then
              regression_executable="$(command -v "$regression_browser")"
              "$regression_executable" --version
              printf 'REGRESSION_CHROMIUM=%s\n' "$regression_executable" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Compare frontend inputs against v12 behavior in Chromium
        run: |
          yarn test:frontend:inputs
          yarn test:frontend:ui
          yarn test:frontend:libraries
      - name: Observe HTTP, database, federation, streaming and browser behavior
        run: yarn test:regression
        env:
          REGRESSION_PG_PORT: '54312'
          REGRESSION_PG_USER: postgres
          REGRESSION_REDIS_PORT: '56312'
      - name: Exercise HTTPS federation across three isolated Misskey containers
        run: yarn test:federation
      - name: Require coverage for changed backend behavior
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          REGRESSION_BASE_REF: ${{ github.event.before }}
          REGRESSION_PATCH_COVERAGE: .maintenance-federation/latest/combined-coverage.json
        run: |
          if ! git cat-file -e "$REGRESSION_BASE_REF^{commit}"; then
            git fetch --no-tags --depth=1 origin "$REGRESSION_BASE_REF"
          fi
          yarn test:regression:patch
      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-regression-${{ github.sha }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .maintenance-ci-install.log
            .maintenance-regression/latest
            .maintenance-federation/latest
            .maintenance-frontend/latest
            packages/backend/coverage
